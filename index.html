<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="theme-color" content="#0F2A47"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Rankings"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png?v=4"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=4"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4"></head><body>
<title>Youth Soccer Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column in a device frame on wide screens, demo notes beside it. Navy app bar, white data surfaces, one pitch-green accent; live red only for games in progress. */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --surface-2: #F6F8FB; --ink: #0E1B2C; --ink-2: #4F5E72; --ink-3: #7F8DA0; --line: #E2E7EE;
  --brand: #0F2A47; --brand-ink: #FFFFFF; --brand-soft: #B9C7D8;
  --accent: #0B7A55; --accent-soft: #E3F2EC; --win: #0B7A55; --draw: #8A97A8; --loss: #C0392B; --warn: #9A6A00; --warn-soft: #FBF2DC;
  --live: #D6303A; --live-soft: #FCE8E9; --frame: #DCE2EA;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A1320; --surface: #111D2D; --surface-2: #16243A; --ink: #E8EEF5; --ink-2: #A3B1C2; --ink-3: #74859A; --line: #22344B;
  --brand: #0C1A2C; --brand-ink: #FFFFFF; --brand-soft: #8EA2BA;
  --accent: #34B886; --accent-soft: #123528; --win: #34B886; --draw: #6D7E93; --loss: #E5675F; --warn: #E7B53C; --warn-soft: #2E2510;
  --live: #FF5A63; --live-soft: #3A1418; --frame: #050B14; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0A1320; --surface: #111D2D; --surface-2: #16243A; --ink: #E8EEF5; --ink-2: #A3B1C2; --ink-3: #74859A; --line: #22344B;
  --brand: #0C1A2C; --brand-ink: #FFFFFF; --brand-soft: #8EA2BA;
  --accent: #34B886; --accent-soft: #123528; --win: #34B886; --draw: #6D7E93; --loss: #E5675F; --warn: #E7B53C; --warn-soft: #2E2510;
  --live: #FF5A63; --live-soft: #3A1418; --frame: #050B14; color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--frame); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
.stage { display: flex; justify-content: center; align-items: flex-start; gap: 40px; }
.phone { width: 100%; max-width: 420px; min-height: 100%; background: var(--bg); position: relative; padding-bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
.notes { display: none; }
@media (min-width: 900px) {
  .stage { padding: 32px 24px; }
  .phone { min-height: 880px; border-radius: 34px; overflow: hidden; box-shadow: 0 0 0 10px #0B1522, 0 40px 90px rgba(10, 20, 35, .28); }
  .notes { display: block; max-width: 330px; color: var(--ink-2); font-size: 14px; position: sticky; top: 32px; }
  .notes h2 { font-family: var(--display); font-weight: 700; font-size: 28px; color: var(--ink); margin: 0 0 8px; line-height: 1.05; }
  .notes p { margin: 0 0 12px; }
  .notes ul { margin: 0 0 12px; padding-left: 18px; } .notes li { margin-bottom: 6px; }
  .notes b { color: var(--ink); }
}
.mobile-note { font-size: 12px; color: var(--ink-3); padding: 10px 16px 0; }
@media (min-width: 900px) { .mobile-note { display: none; } }

.appbar { background: var(--brand); color: var(--brand-ink); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 4; min-height: 50px; }
.wordmark { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; letter-spacing: .01em; white-space: nowrap; text-transform: uppercase; }
.wm-t { display: flex; flex-direction: column; line-height: 1; }
.wm-t small { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--brand-soft); }
.wm-t b { font-size: 21px; font-weight: 800; letter-spacing: .03em; color: #4BE0A0; }
.wordmark img { width: 40px; height: 40px; flex: none; object-fit: contain; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
.context { font-size: 12px; color: var(--brand-soft); font-weight: 600; white-space: nowrap; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 4px 10px; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--brand-ink); font-weight: 600; font-size: 15px; }
.back svg { width: 18px; height: 18px; }

.screen { padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.title { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.05; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 4px; }
.section-h h2 { font-family: var(--display); font-weight: 700; font-size: 20px; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); }
.sm { font-size: 13px; } .xs { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.disp { font-family: var(--display); font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.link { color: var(--accent); font-weight: 600; font-size: 13px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.panel-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.rows > * + * { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.between { justify-content: space-between; }

.code { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .03em; color: var(--ink-2); }
.code.lg { width: 52px; height: 52px; border-radius: 13px; font-size: 18px; }
.code.on-brand { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.18); color: var(--brand-ink); }

.hero { background: var(--brand); color: var(--brand-ink); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.hero h2 { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; }
.hero .meta { color: var(--brand-soft); font-size: 13px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid rgba(255,255,255,.14); padding-top: 12px; }
.kpis > div + div { border-left: 1px solid rgba(255,255,255,.14); padding-left: 12px; }
.kpi-v { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi-l { font-size: 12px; color: var(--brand-soft); margin-top: 3px; }
.btn-ghost { border: 1px solid rgba(255,255,255,.35); color: var(--brand-ink); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.btn-ghost[aria-pressed="true"] { background: var(--brand-ink); color: var(--brand); border-color: var(--brand-ink); }
.btn { display: block; width: 100%; text-align: center; padding: 11px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--loss); }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.form { display: inline-flex; gap: 3px; }
.form i { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; font-style: normal; color: #fff; font-weight: 700; font-size: 10px; }
.W { background: var(--win); } .D { background: var(--draw); } .L { background: var(--loss); }

.match-head { display: flex; justify-content: space-between; gap: 8px; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
.match-head b { color: var(--ink); font-weight: 600; }
.side { display: flex; align-items: center; gap: 10px; }
.side .pct { font-family: var(--display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
.side .pct.fav { color: var(--accent); }
.tri { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; }
.tri span:nth-child(1) { background: var(--win); } .tri span:nth-child(2) { background: var(--draw); } .tri span:nth-child(3) { background: var(--loss); }
.tri-legend { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--accent-soft); color: var(--accent); }
.chip.live { background: var(--live-soft); color: var(--live); }
.chip.plain { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); display: inline-block; }
@media (prefers-reduced-motion: no-preference) { .dot { animation: pulse 1.6s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .3; } } }

.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th { font-size: 11px; font-weight: 600; color: var(--ink-3); text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.tbl td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th:first-child, .tbl td:first-child { padding-left: 14px; }
.tbl th:last-child, .tbl td:last-child { padding-right: 14px; }
.tbl .r { text-align: right; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--surface-2); }
.tbl tr.hl td { background: var(--accent-soft); }
.rk { font-family: var(--display); font-weight: 700; font-size: 18px; width: 30px; }
.mv { font-size: 11px; font-weight: 700; display: block; }
.up { color: var(--win); } .down { color: var(--loss); } .flat { color: var(--ink-3); }
.score { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
.res { width: 18px; height: 18px; border-radius: 4px; display: inline-grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; }

.list-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; width: 100%; }
.list-item:hover { background: var(--surface-2); }
.chev { color: var(--ink-3); width: 16px; height: 16px; flex: none; }
.notice { border: 1px solid var(--line); border-left: 3px solid var(--warn); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--ink-2); }
.notice b { color: var(--ink); }
.notice.info { border-left-color: var(--accent); }
.link-flag { color: var(--warn); font-weight: 600; }
.wx { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; text-align: left; }
.wx svg { width: 30px; height: 30px; flex: none; }
.wx-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.wx-t { font-size: 14px; font-weight: 600; color: var(--ink); }
.wx-t b { font-family: var(--display); font-size: 18px; font-weight: 700; margin-right: 6px; }
.wx-s { font-size: 12px; color: var(--ink-2); }
.wx-pending { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.wx-pending svg, .wx-mini svg { width: 16px; height: 16px; flex: none; }
.wx-mini { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-2); font-weight: 600; }

.seg { display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; text-align: center; padding: 7px 8px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(14,27,44,.14); }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.filters .wide { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .field .lbl { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.field select, .field input { font: inherit; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.field input[aria-invalid="true"] { border-color: var(--loss); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.err { color: var(--loss); font-size: 13px; }

.stepper { display: flex; align-items: center; justify-content: center; gap: 10px; }
.step-col { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.step-col .nm { font-size: 12px; color: var(--ink-2); font-weight: 600; text-align: center; max-width: 100%; }
.step { display: flex; align-items: center; gap: 8px; }
.step button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 20px; font-weight: 600; display: grid; place-items: center; text-align: center; }
.step .v { font-family: var(--display); font-weight: 700; font-size: 40px; min-width: 32px; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }
.dash { font-family: var(--display); font-weight: 700; font-size: 32px; color: var(--ink-3); padding-top: 18px; }
.move { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
.move .big { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.move .arrow { font-size: 20px; color: var(--ink-3); }

.board { background: var(--brand); color: var(--brand-ink); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.board .teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.board .t { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.board .t span { font-size: 13px; font-weight: 600; max-width: 100%; }
.board .sc { font-family: var(--display); font-weight: 700; font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; }
.board .clock { text-align: center; font-size: 13px; color: var(--brand-soft); display: flex; align-items: center; justify-content: center; gap: 6px; }
.goal-btn { border-radius: 10px; padding: 12px; font-weight: 700; text-align: center; background: var(--accent); color: #fff; }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 9; max-width: 340px; text-align: center; }

.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.stat-grid > div { background: var(--surface); padding: 10px 14px; min-width: 0; }
.stat-v { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 11px; color: var(--ink-3); }
.spark { width: 100%; height: 86px; display: block; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; pointer-events: none; }
.tabs nav { pointer-events: auto; width: 100%; max-width: 420px; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 2px calc(6px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) { .tabs { position: absolute; } }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-3); padding: 4px 0; text-align: center; position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab .badge { position: absolute; top: 2px; left: 55%; width: 8px; height: 8px; border-radius: 50%; background: var(--live); }

/* Pro: game stats with video proof, pricing */
:root { --proof-self: var(--ink-3); --gold: #B07A10; --gold-soft: #FBF2DC; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --gold: #E7B53C; --gold-soft: #2E2510; } }
:root[data-theme="dark"] { --gold: #E7B53C; --gold-soft: #2E2510; }
.tabs nav { grid-template-columns: repeat(6, 1fr); }
.chip.self { background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }
.chip.clip { background: var(--warn-soft); color: var(--warn); }
.chip.verified { background: var(--accent-soft); color: var(--accent); }
.chip.pro-chip { background: var(--gold-soft); color: var(--gold); letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }
.proof-n { font-weight: 700; color: var(--accent); }
.boxsc { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px 14px; padding: 12px 14px; align-items: center; }
.boxsc.hdr { border-bottom: 1px solid var(--line); background: var(--surface-2); padding: 9px 14px; }
.boxsc .bv { font-family: var(--display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.boxsc .bv.r { text-align: right; }
.boxsc .bl { text-align: center; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.pbar { height: 8px; border-radius: 4px; background: var(--loss); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.pbp { display: flex; align-items: center; gap: 10px; padding: 10px 14px; flex-wrap: wrap; }
.pbp .mn { width: 30px; font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 13px; }
.pbp-act { width: 100%; display: flex; align-items: center; gap: 14px; padding-left: 74px; }
.pbp-act .link { font-size: 13px; }
.mini { font-size: 12px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
.mini[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.statbtn { padding: 11px 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 13px; text-align: center; color: var(--ink); }
.statbtn:active, .statbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.or { text-align: center; font-size: 12px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding-top: 4px; }
.locked { position: relative; }
.locked .tbl, .locked .boxsc { filter: blur(5px); opacity: .55; user-select: none; }
.lock { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 16px; background: color-mix(in srgb, var(--surface) 55%, transparent); text-align: center; font-size: 13px; color: var(--ink-2); }
.lock b { color: var(--ink); }
.panel.locked .boxsc { min-height: 170px; }
.founder { background: var(--brand); color: var(--brand-ink); border-radius: 14px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.founder::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; border: 18px solid rgba(75,224,160,.12); }
.f-k { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brand-soft); }
.f-h { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.02; color: #4BE0A0; text-transform: uppercase; max-width: 15ch; }

// ================= rating engine (same model as packages/core/src/rating.ts) =================
const P = { windowDays: 540, halfLifeDays: 180, marginCap: 6, priorGames: 2, iterations: 300 };

  }

    const rec = { w: 0, d: 0, l: 0, gf: 0, ga: 0 }, form = []; let eff = 0;

  const start = x.half === 2 ? x.secondAt : x.kickoffAt; if (!start) return "Live";

  return x.half === 2 ? `${Math.min(HALF + m, HALF * 2)}′` : `${Math.min(m, HALF)}′`;
};

// ---------- forecast ----------
function whatIf(team, opp, gf, ga, asOf, beforeModel) {
  const games = allGames().filter((g) => g.date <= asOf);
  const before = beforeModel ?? fit(games, asOf);
  const withGame = [...games, { date: asOf, a: team, b: opp, ga: gf, gb: ga, ev: null }];
  const after = fit(withGame, asOf);
  const pool = (m, gs) => { const g = mainGroup(gs); return Object.keys(m.R).filter((id) => (g.has(id) || D.unranked.includes(id)) && m.R[id].games >= 3 && inScope(id)); };
  const stand = (m, gs, id) => { const list = rankIds(m, pool(m, gs)); const i = list.indexOf(id); return { rank: i < 0 ? null : i + 1, of: list.length, power: m.R[id]?.power ?? 0 }; };
  const p = predictWith(before, team, opp);
  return { before, team: { before: stand(before, games, team), after: stand(after, withGame, team) }, opp: { before: stand(before, games, opp), after: stand(after, withGame, opp) }, expected: p.xh - p.xa };
}
const scoreline = (m) => (m > 0 ? [m, 0] : m < 0 ? [0, -m] : [1, 1]);
const rankStr = (s) => (s.rank ? "#" + s.rank : "NR");
function Forecast() {
  const s = store.get();
  const opts = Object.keys(M.R).sort((x, y) => T[x].name.localeCompare(T[y].name));
  let a = s.fa && M.R[s.fa] ? s.fa : s.mine;
  let b = s.fb && M.R[s.fb] && s.fb !== a ? s.fb : (fixturesFor(a)[0]?.opp ?? opts.find((x) => x !== a));
  if (!M.R[b]) b = opts.find((x) => x !== a);
  const f = D.fixtures.find((x) => ((x.a === a && x.b === b) || (x.a === b && x.b === a)) && x.date >= TODAY && !isDone(x));
  const asOf = f ? f.date : TODAY;
  const sel = (key, val, label) => `<div class="field"><label for="${key}">${label}</label><select id="${key}">${opts.map((id) => `<option value="${id}" ${id === val ? "selected" : ""}>${esc(T[id].name)}</option>`).join("")}</select></div>`;
  const w = whatIf(a, b, s.gf, s.gaa, asOf);
  const dP = w.team.after.power - w.team.before.power, dR = w.team.before.rank && w.team.after.rank ? w.team.before.rank - w.team.after.rank : null;
  const res = s.gf > s.gaa ? "win" : s.gf < s.gaa ? "loss" : "draw";
  let headline;
  if (!w.team.before.rank && w.team.after.rank) headline = `This game would connect ${esc(T[a].name)} to the ranked group at #${w.team.after.rank}.`;
  else if (dR > 0) headline = `A ${s.gf}–${s.gaa} ${res} moves ${esc(T[a].name)} up ${dR} to #${w.team.after.rank}.`;
  else if (dR < 0) headline = `A ${s.gf}–${s.gaa} ${res} drops ${esc(T[a].name)} ${-dR} to #${w.team.after.rank}.`;
  else headline = `A ${s.gf}–${s.gaa} ${res} keeps ${esc(T[a].name)} at ${rankStr(w.team.after)}, rating ${dP >= 0 ? "up" : "down"} ${Math.abs(dP).toFixed(2)}.`;
  const ladder = [-3, -2, -1, 0, 1, 2, 3, 5].map((m) => { const [x, y] = scoreline(m); return { m, x, y, r: whatIf(a, b, x, y, asOf, w.before) }; });
  let be = null; for (let m = -6; m <= 10; m++) { const [x, y] = scoreline(m); const r = whatIf(a, b, x, y, asOf, w.before); if (r.team.after.power >= r.team.before.power) { be = m; break; } }
  const exp = w.expected, expRow = Math.round(exp);
  const lbl = (m, x, y) => (m > 0 ? `Win by ${m}` : m < 0 ? `Lose by ${-m}` : "Draw") + ` <span class="faint">(${x}–${y})</span>`;
  const beText = be == null ? "" : be > 0 ? `${esc(T[a].name)} needs to win by ${be} or more to raise its rating. The model expects about a ${Math.abs(exp).toFixed(1)}-goal ${exp >= 0 ? "win" : "loss"}.`
    : be === 0 ? `A draw or better keeps ${esc(T[a].name)}'s rating steady. The model expects about a ${Math.abs(exp).toFixed(1)}-goal ${exp >= 0 ? "win" : "loss"}.`
    : `Even losing by ${-be} wouldn't lower ${esc(T[a].name)}'s rating. The model expects about a ${Math.abs(exp).toFixed(1)}-goal loss.`;
  return `<section class="screen">
    <div><h1 class="title">Forecast</h1><p class="sm muted">See the odds, then try a final score to see how it would move the rankings (${scopeLabel()}).</p></div>
    <div class="panel"><div class="panel-body">${sel("fa", a, "Your team")}${sel("fb", b, "Opponent")}</div></div>
    ${oddsPanel(a, b, f)}
    <div class="section-h"><h2>If the final score is…</h2></div>
    <div class="panel"><div class="panel-body">
      <div class="stepper">

        <span class="dash">–</span>
        <div class="step-col"><span class="nm ell">${esc(T[b].name)}</span><div class="step"><button data-step="gaa|-1" aria-label="One fewer goal for ${esc(T[b].name)}">−</button><span class="v">${s.gaa}</span><button data-step="gaa|1" aria-label="One more goal for ${esc(T[b].name)}">+</button></div></div>
      </div>
      <p style="font-weight:600">${headline}</p>
      <div class="move">
        <div><div class="xs faint">${scopeLabel()} rank now</div><div class="big">${rankStr(w.team.before)}</div></div><div class="arrow">→</div>
        <div><div class="xs faint">After this game</div><div class="big ${dR > 0 ? "up" : dR < 0 ? "down" : ""}">${rankStr(w.team.after)}</div></div>
      </div>
    </div>
    <div class="stat-grid">
      <div><div class="stat-v">${signed(w.team.before.power, 2)}</div><div class="stat-l">Rating now</div></div>
      <div><div class="stat-v ${dP >= 0 ? "up" : "down"}">${signed(dP, 2)}</div><div class="stat-l">Rating change</div></div>
      <div><div class="stat-v">${rankStr(w.opp.before)} → ${rankStr(w.opp.after)}</div><div class="stat-l">${esc(T[b].code)} rank${w.opp.before.rank ? "" : " (NR = not ranked)"}</div></div>
    </div></div>
    <div class="section-h"><h2>Every result at a glance</h2></div>
    <div class="panel"><table class="tbl"><thead><tr><th>Result</th><th class="r">Rating</th><th class="r">${scopeLabel()} rank</th></tr></thead><tbody>
      ${ladder.map(({ m, x, y, r }) => { const d = r.team.after.power - r.team.before.power, rk = r.team.after.rank, rb = r.team.before.rank;
        return `<tr class="${m === expRow ? "hl" : ""}"><td>${lbl(m, x, y)}${m === expRow ? ` <span class="chip ok">Expected</span>` : ""}</td><td class="r num ${d >= 0 ? "up" : "down"}" style="font-weight:600">${signed(d, 2)}</td>
        <td class="r num" style="white-space:nowrap">${rankStr(r.team.after)}${rb && rk && rb !== rk ? ` <span class="${rk < rb ? "up" : "down"}">${rk < rb ? "▲" : "▼"}${Math.abs(rb - rk)}</span>` : ""}</td></tr>`; }).join("")}
    </tbody></table>
    ${beText ? `<div class="panel-body" style="border-top:1px solid var(--line)"><p class="sm muted">${beText} Margins past 6 goals don't count extra.</p></div>` : ""}</div>
    ${h2hAndCommon(a, b)}
  </section>`;
}

// ---------- live ----------
function Live() {

  const modeNote = liveMode === "shared" ? (canWrite === false ? `<div class="notice info">Scores update live on this page for everyone viewing it. You have view access, so you can watch but not keep score.</div>` : `<div class="notice info"><b>Scores sync live</b> to everyone ${IN_APP ? "using the app" : "viewing this page"}. ${REQ > 1 ? `A final counts in the rankings once ${REQ} people confirm it.` : "A final score feeds straight into the rankings and forecasts."}</div>`)

}

async function confirmFinal(id) {

// ---------- add a game or result ----------
const slugify = (t) => t.toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g, "").trim().replace(/[\s_]+/g, "-").replace(/-+/g, "-").slice(0, 60);
const fmtTime = (hm) => { const [h, m] = hm.split(":").map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; };

async function addGame(fd, err) {

  const nameOk = (x) => /^[\p{L}\p{N}' .&()\/-]{2,60}$/u.test(x);
  if (!nameOk(a) || !nameOk(b)) return err("g-err", "Enter both team names (2 to 60 characters).");
  if (a.toLowerCase() === b.toLowerCase()) return err("g-err", "Pick two different teams.");
  if (!/^\d{4}-\d\d-\d\d$/.test(date)) return err("g-err", "Pick a date.");
  const ahead = (Date.parse(date) - Date.parse(localToday)) / 864e5;
  if (ahead > 120 || ahead < -365) return err("g-err", "Pick a date within the past year or the next four months.");
  const hasScore = gaS !== "" || gbS !== "";
  if (hasScore) {
    if (!/^\d{1,2}$/.test(gaS) || !/^\d{1,2}$/.test(gbS) || +gaS > 30 || +gbS > 30) return err("g-err", "Enter both scores as whole numbers, or leave both blank.");

  } else if (date < localToday) return err("g-err", "For a game that's already been played, enter the final score.");

    const confirms = proof === "verified" ? 2 + Math.floor(r(i + 7) * 2) : proof === "clip" ? Math.floor(r(i + 9) * 2) : 0;
    ev.push({ id: key + "#" + i++, team, kind, minute, player: String(2 + Math.floor(r(i + 3) * 20)), ts: proof === "self" ? null : ts, video: proof === "self" ? null : "v1", confirms, disputes: 0, mine: false, example: true });
  };
  const side = (team, goals, oppGoals) => {
    const pk = goals > 0 && r(team + "pk") < .35;
    for (let k = 0; k < goals; k++) add(team, pk && k === 0 ? "pk_made" : "goal", 4 + Math.floor(r(team + k) * 64), r(team + "g" + k) < .55 ? "verified" : "clip");
    const shots = goals + 2 + Math.floor(r(team + "s") * 6);

  // saves come from the other side's shots on target that didn't go in
  for (const t of [g.a, g.b]) {
    const opp = t === g.a ? g.b : g.a;
    ev.filter((e) => e.team === opp && e.kind === "shot_on_target").forEach((e, k) => add(t, "save", e.minute, k % 3 === 0 ? "verified" : "clip"));
  }
  ev.sort((x, y) => x.minute - y.minute);

function gameData(a, b, date) {
  const key = gameKey(a, b, date), g = findGame(a, b, date), st = PRO.get();
  const followed = g && (g.a === store.get().mine || g.b === store.get().mine);
  const base = followed ? seedExample(key, g) : { events: [], videos: [], poss: null };
  const events = [...base.events, ...(st.events[key] || [])].map((e) => {
    const v = st.votes[e.id];
    const confirms = e.confirms + (v === "confirm" ? 1 : 0), disputes = e.disputes + (v === "dispute" ? 1 : 0);
    const proof = !e.video || e.ts == null ? "self" : confirms >= 2 && confirms > disputes ? "verified" : "clip";
    return { ...e, confirms, disputes, proof };
  }).sort((x, y) => (x.minute ?? 999) - (y.minute ?? 999));
  return { key, g, followed, events, videos: [...base.videos, ...(st.videos[key] || [])], poss: st.poss[key] || base.poss };
}
function line(events, team) {
  const m = events.filter((e) => e.team === team), n = (...k) => m.filter((e) => k.includes(e.kind)).length;
  const goals = n("goal", "pk_made"), onT = goals + n("shot_on_target");
  return { goals, shots: onT + n("shot", "pk_missed", "pk_saved"), onT, saves: n("save"), pkMade: n("pk_made"), pkMiss: n("pk_missed", "pk_saved"), corners: n("corner"), fouls: n("foul"), proven: m.filter((e) => e.proof !== "self").length, total: m.length };
}
function teamTotals(id) {
  let t = { games: 0, goals: 0, goalsV: 0, shots: 0, saves: 0, savesV: 0, pkMade: 0, pkMiss: 0, possSum: 0, possN: 0 };
  for (const g of gamesFor(id)) {
    const d = gameData(id, g.opp, g.date); if (!d.events.length) continue;
    t.games++;
    const L = line(d.events, id), mine = d.events.filter((e) => e.team === id);
    t.goals += L.goals; t.shots += L.shots; t.saves += L.saves; t.pkMade += L.pkMade; t.pkMiss += L.pkMiss;
    t.goalsV += mine.filter((e) => ["goal", "pk_made"].includes(e.kind) && e.proof !== "self").length;
    t.savesV += mine.filter((e) => e.kind === "save" && e.proof !== "self").length;
    if (d.poss) { t.possSum += d.poss.a === id ? d.poss.pct : 100 - d.poss.pct; t.possN++; }
  }
  return t;
}

function teamStatsPanel(id) {
  const t = teamTotals(id), pro = PRO.get().pro;
  if (!t.games) return `<div class="section-h"><h2>Team stats</h2><span class="chip pro-chip">Pro</span></div>

  const rows = [["Goals", t.goals, t.goalsV], ["Shots", t.shots, null], ["Saves", t.saves, t.savesV], ["PKs made / missed", `${t.pkMade} / ${t.pkMiss}`, null], ["Avg possession", t.possN ? Math.round(t.possSum / t.possN) + "%" : "–", null]];
  return `<div class="section-h"><h2>Team stats</h2><span class="chip pro-chip">Pro</span></div>

// ---- interactions for the Pro screens ----
let ptState = { holder: null, a: 0, b: 0, last: 0, timer: null };
function ptTick() {
  const now = Date.now();
  if (ptState.holder) ptState[ptState.holder] += (now - ptState.last) / 1000;
  ptState.last = now;
  const tot = ptState.a + ptState.b, pct = tot ? (ptState.a / tot) * 100 : 50;
  const A = $("pt-a-t"), B = $("pt-b-t"), bar = $("pt-bar"), save = $("pt-save");
  if (!A) { clearInterval(ptState.timer); ptState.timer = null; return; }
  A.textContent = clock(ptState.a); B.textContent = clock(ptState.b); bar.style.width = pct + "%";
  save.textContent = tot ? `Save ${Math.round(pct)}%` : "Save";
  $("pt-a").classList.toggle("on", ptState.holder === "a"); $("pt-b").classList.toggle("on", ptState.holder === "b");
}
function setPoss(key, a, pct, source) {
  const st = PRO.get(); PRO.set({ poss: { ...st.poss, [key]: { a, pct: Math.max(0, Math.min(100, pct)), source } } });
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-x]"); if (!el) return;
  const [act, p1, p2, p3] = el.dataset.x.split("|"), st = PRO.get();
  if (act === "gopro") return setTab("pro");
  if (act === "stats") return go({ type: "stats", a: p1, b: p2, date: p3 });
  if (act === "claim") { PRO.set({ pro: true, founder: 1 }); toast("Welcome, founding member #1. Pro is free for a year."); return render(); }
  if (act === "buy") {
    if (p1 === "team") { PRO.set({ pro: true, plan: "team", teamCode: st.teamCode || ("TEAM" + hash(String(Date.now())).slice(0, 4)).toUpperCase() }); toast("Team plan active. Share the code with your team."); }
    else { PRO.set({ pro: true, plan: p1 }); toast(`In the live app this opens Stripe checkout for ${p1 === "yearly" ? "$29/year" : "$3/month"}. Pro unlocked for this preview.`); }
    return render();
  }
  if (act === "join") { const c = ($("join-code").value || "").trim().toUpperCase(); if (c.length < 6) return toast("Codes are 8 letters and numbers."); PRO.set({ pro: true, joined: true }); toast("Joined the team plan. Pro is unlocked."); return render(); }
  if (act === "reset") { PRO.set({ pro: false, founder: null, plan: null, teamCode: null, joined: false, events: {}, videos: {}, poss: {}, votes: {} }); toast("Preview reset."); return render(); }
  if (act === "draftteam") { PRO.set({ draftTeam: p1 }); document.querySelectorAll(`[data-x^="draftteam|"]`).forEach((b) => b.setAttribute("aria-pressed", b === el)); return; }
  if (act === "watch") { return toast(p3 ? `Opening the ${p2} video at ${clock(+p1)}…` : `In the live app this opens the ${p2} game video at ${clock(+p1)}.`); }
  if (act === "vote") { const cur = st.votes[p1]; PRO.set({ votes: { ...st.votes, [p1]: cur === p2 ? null : p2 } }); toast(cur === p2 ? "Vote removed." : p2 === "confirm" ? "Confirmed. Two confirms make a stat Verified." : "Disputed. The parent who entered it gets a note."); return render(); }
  if (act === "addstat") {
    const key = p2, err = $("st-err"), minRaw = $("st-min").value.trim(), tsRaw = $("st-ts")?.value.trim() ?? "", vid = $("st-vid")?.value ?? "";
    const ts = tsRaw ? parseClockStr(tsRaw) : null;
    if (tsRaw && ts == null) { err.textContent = "Video time looks like 34:12 (minutes:seconds)."; err.hidden = false; return; }
    if (minRaw && !(+minRaw >= 0 && +minRaw <= 130)) { err.textContent = "Game minute is a number from 0 to 130."; err.hidden = false; return; }
    const g = gameData(...key.split("@")[0].split("~"), key.split("@")[1]);
    const team = st.draftTeam && [g.g.a, g.g.b].includes(st.draftTeam) ? st.draftTeam : current().a;
    const v = g.videos.find((x) => x.id === vid);
    const minute = minRaw ? +minRaw : v && ts != null && ts >= v.kick ? Math.min(130, Math.floor((ts - v.kick) / 60) + 1) : null;
    const item = { id: key + "#u" + Date.now(), team, kind: p1, minute, player: $("st-pl").value.trim().slice(0, 4) || null, ts: vid && ts != null ? ts : null, video: vid && ts != null ? vid : null, confirms: 0, disputes: 0, mine: true };
    PRO.set({ events: { ...st.events, [key]: [...(st.events[key] || []), item] } });
    toast(`${KINDS[p1]} added for ${T[team].code}${item.video ? " with video proof" : ""}.`);
    return render();
  }
  if (act === "addvid") {
    const key = p1, url = $("vid-url").value.trim(), file = $("vid-file").files?.[0], kick = parseClockStr($("vid-kick").value || "0");
    if (!url && !file) return toast("Paste a link or choose a video file.");
    if (url && !/^https:\/\//i.test(url)) return toast("Links start with https://");
    if (kick == null) return toast("Kickoff time looks like 2:15.");
    let provider = "Upload";
    if (url) { try { const h = new URL(url).hostname; provider = /veo\.co/.test(h) ? "Veo" : /traceup/.test(h) ? "Trace" : /hudl/.test(h) ? "Hudl" : /youtu/.test(h) ? "YouTube" : "Link"; } catch { return toast("That link doesn't look right."); } }
    const list = st.videos[key] || [];
    PRO.set({ videos: { ...st.videos, [key]: [...list, { id: "u" + Date.now(), provider, url: url || null, kick, example: false }] } });
    toast(`${provider} video added${file ? ` (${file.name})` : ""}.`);
    return render();
  }
  if (act === "ptrack") {
    ptState.holder = p1 === "pause" ? null : p1; ptState.last = Date.now();
    if (!ptState.timer) ptState.timer = setInterval(ptTick, 250);
    return ptTick();
  }
  if (act === "psave") {
    const tot = ptState.a + ptState.b; if (tot < 5) return toast("Track at least a few seconds first.");
    setPoss(p1, p2, (ptState.a / tot) * 100, "In-app tracker"); ptState = { holder: null, a: 0, b: 0, last: 0, timer: ptState.timer };
    toast("Possession saved."); return render();
  }
  if (act === "pvsave") { const v = +$("pv-pct").value; if (!(v >= 0 && v <= 100)) return toast("Enter a percentage from 0 to 100."); setPoss(p1, p2, v, $("pv-src").value); toast("Possession saved."); return render(); }
});

  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === s.tab ? "page" : "false"));

}
function safeRender() {

let pendingRender = false;
document.addEventListener("focusout", () => { if (pendingRender) { pendingRender = false; setTimeout(render, 0); } });

$("mobile-note").textContent = IN_APP ? `Built-in results through ${short(D.resultsThrough)}, plus games added by parents and coaches. Rankings, odds and forecasts are calculated by this app.` : `Preview with real U12 girls results through ${short(D.resultsThrough)}. Rankings, odds and forecasts are calculated by this app.`;
if (IN_APP) $("notes").hidden = true;

  <li><b>Filters</b>: girls or boys, state or national, from the Rankings tab or the pill at the top.</li></ul>`;

// ================= events =================
document.addEventListener("click", (e) => {
  const el = e.target.closest("button, tr.click"); if (!el) return;
  const d = el.dataset;
  if (d.tab) return setTab(d.tab);
  if ("back" in d) return back();
  if (d.set) { const p = JSON.parse(d.set); store.set(p); return render(); }
  if (d.team) return go({ type: "team", id: d.team });
  if (d.match) { const [a, b, date] = d.match.split("|"); return go({ type: "match", a, b, date }); }
  if (d.event) return go({ type: "event", id: d.event });
  if (d.forecast !== undefined) { const [a, b] = d.forecast.split("|"); store.set({ fa: a, fb: b || null }); return setTab("forecast"); }
  if (d.step) { const [k, n] = d.step.split("|"); const s = store.get(); store.set({ [k]: Math.max(0, Math.min(15, s[k] + Number(n))) }); return render(); }
  if (d.score) return go({ type: "score", id: d.score });
  if ("addgame" in d) { draft = {}; return go({ type: "addgame" }); }
  if (d.confirm) return void confirmFinal(d.confirm);
  if (d.live) { const [k, id] = d.live.split("|"); return void liveAction(k, id); }
  if ("about" in d) return go({ type: "about" });
  if ("report" in d) { $("report-msg").hidden = false; return; }
  if ("addplayer" in d) { draft = {}; return go({ type: "addplayer" }); }
  if (d.player) { draft = {}; return go({ type: "player", id: d.player }); }
  if (d.delplayer) { $("del-btn").hidden = true; $("del-confirm").hidden = false; return; }
  if ("delcancel" in d) { $("del-btn").hidden = false; $("del-confirm").hidden = true; return; }
  if (d.delyes) { const s = PL.get(); s.players = s.players.filter((p) => p.id !== d.delyes); s.lines = s.lines.filter((l) => l.playerId !== d.delyes); PL.save(); toast("Player removed."); return back(); }
  if ("clearlive" in d) { $("clear-confirm").hidden = false; el.hidden = true; return; }
  if ("clearcancel" in d) { $("clear-confirm").hidden = true; document.querySelector("[data-clearlive]").hidden = false; return; }
  if ("clearyes" in d) { void clearLive(); return; }
  if (d.follow) { const s = store.get(), id = d.follow; if (s.mine === id) return; store.set({ watch: s.watch.includes(id) ? s.watch.filter((x) => x !== id) : [...s.watch, id] }); return render(); }
});
document.addEventListener("change", (e) => {
  const id = e.target.id;
  if (id === "fa" || id === "fb") { store.set({ [id]: e.target.value }); return render(); }
  if (id === "f-state") { store.set({ state: e.target.value }); return render(); }
  if (e.target.form) draft[e.target.name] = e.target.value;
});
document.addEventListener("input", (e) => { if (e.target.form) draft[e.target.name] = e.target.value; });
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const fd = new FormData(e.target), err = (id, msg) => { const n = $(id); n.textContent = msg; n.hidden = false; };
  if (e.target.id === "add-game") return void addGame(fd, err);
  if (e.target.id === "add-player") {
    const first = String(fd.get("first")).trim(), initial = String(fd.get("initial")).trim(), jersey = String(fd.get("jersey")).trim();
    if (!/^[\p{L}' -]{1,30}$/u.test(first)) return err("p-err", "Enter a first name (letters only).");
    if (!/^\p{L}$/u.test(initial)) return err("p-err", "Enter one letter for the last initial.");
    if (jersey && !/^\d{1,2}$/.test(jersey)) return err("p-err", "Jersey number should be 0–99.");
    const s = PL.get(), p = { id: "p" + Date.now().toString(36), teamId: String(fd.get("team")), first, initial: initial.toUpperCase(), jersey: jersey ? Number(jersey) : null, pos: String(fd.get("pos")) };
    s.players.push(p); PL.save(); draft = {}; stack.pop(); toast(`${dispName(p)} added. Now log a game.`); return go({ type: "player", id: p.id });
  }
  if (e.target.id === "add-stats") {
    const pid = e.target.dataset.pid, s = PL.get(), p = s.players.find((x) => x.id === pid);
    const games = gamesFor(p.teamId).filter((g) => !s.lines.some((l) => l.playerId === pid && l.date === g.date && l.opp === g.opp));
    const g = games[Number(fd.get("game"))], n = (k, max) => { const v = String(fd.get(k) ?? "0").trim(); return /^\d{1,3}$/.test(v) && Number(v) <= max ? Number(v) : null; };
    const minutes = n("minutes", 100); if (minutes == null) return err("s-err", "Minutes should be 0–100.");
    const line = { playerId: pid, opp: g.opp, date: g.date, minutes, goals: 0, assists: 0, saves: null, conceded: null };
    if (p.pos === "GK") { line.saves = n("saves", 40); line.conceded = n("conceded", 30); if (line.saves == null || line.conceded == null) return err("s-err", "Saves and goals allowed should be whole numbers."); }
    else { line.goals = n("goals", 20); line.assists = n("assists", 20); if (line.goals == null || line.assists == null) return err("s-err", "Goals and assists should be whole numbers."); if (line.goals > g.gf) return err("s-err", `The team only scored ${g.gf} in that game.`); }
    s.lines.push(line); PL.save(); draft = {}; toast("Stats saved."); return render();
  }
});
async function clearLive() {
  const ids = Object.keys(live); live = {}; recompute(); render(); toast("Live scores cleared.");
  if (liveMode === "shared") { for (const id of ids) { try { await db.doc("live/" + id).delete(); } catch {} } }
  else { try { localStorage.setItem("uf-live-local", "{}"); } catch {} }
}

// ================= live sync =================
render();
setInterval(() => { const v = current(); if ((v?.type === "score" || (!v && ["live", "home"].includes(store.get().tab))) && liveList().some((x) => x.status === "live")) safeRender(); }, 30000);
(async () => {
  try {
    db = window.claude?.use ? await window.claude.use("db") : null;
    const user = db && window.claude?.use ? await window.claude.use("user") : null;
    if (user) { try { const c = await user.can("data.write"); canWrite = c === null ? null : !!c; } catch { canWrite = null; } }
  } catch { db = null; }
  if (!db) { liveMode = "local"; safeRender(); return; }
  liveMode = "shared"; live = {};
  db.collection("live").onSnapshot((snap) => {
    const next = {}; snap.docs.forEach((d) => { if (d.exists) next[d.id] = d.data(); });
    live = withPend("live", next); recompute(); safeRender();
  }, () => { liveMode = "local"; try { live = JSON.parse(localStorage.getItem("uf-live-local") || "{}"); } catch { live = {}; } recompute(); safeRender(); });
  const sub = (name, apply) => db.collection(name).onSnapshot((snap) => {
    const next = {}; snap.docs.forEach((d) => { if (d.exists) next[d.id] = d.data(); });
    apply(next); applyCrowd(); recompute(); safeRender();
  }, () => {});
  sub("teams", (n) => { userTeams = withPend("teams", n); }); sub("fixtures", (n) => { userFx = withPend("fixtures", n); }); sub("confirms", (n) => { confirms = withPend("confirms", n); });
})();
// licensed data feed (config.js feedUrl): same shape as the built-in data
(window.YSR_FEED || Promise.resolve(null)).then((feed) => {
  if (!feed || typeof feed !== "object") return;
  Object.assign(EV, feed.events || {});
  for (const t of Object.values(feed.teams || {})) if (t?.id && t.name && !T[t.id]) T[t.id] = { focus: false, history: [], age: "U12", state: "CA", gender: "girls", code: t.name.replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase(), ...t };
  const have = new Set(D.games.map(pairKey));
  for (const g of feed.games || []) if (T[g.a] && T[g.b] && Number.isInteger(g.ga) && Number.isInteger(g.gb) && !have.has(pairKey(g))) { D.games.push(g); have.add(pairKey(g)); }
  for (const f of feed.fixtures || []) if (T[f.a] && T[f.b] && /^\d{4}-\d\d-\d\d$/.test(f.date || "")) { const id = fxId(f); if (!D.fixtures.some((x) => x.id === id)) D.fixtures.push({ venue: null, time: null, ...f, id }); }
  applyCrowd(); recompute(); safeRender();
});
// offline support when installed
if ("serviceWorker" in navigator && location.protocol === "https:" && IN_APP) navigator.serviceWorker.register("sw.js").catch(() => {});
